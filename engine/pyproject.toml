[project]
name = "chronos-engine"
version = "0.1.0"
description = "Timetable constraint engine (OR-Tools CP-SAT)"
requires-python = ">=3.11"
dependencies = ["ortools>=9.10"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chronos_engine"]
